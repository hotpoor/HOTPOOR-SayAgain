<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob: sayagain-asset:; connect-src 'self' blob: sayagain-asset:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>HOTPOOR SayAgain</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="主导航">
    <div class="window-space"></div>
    <div class="brand"><span class="brand-symbol" aria-hidden="true">s<span>↗</span></span><div>SayAgain<small>HOTPOOR</small></div></div>
    <button class="new-entry" data-action="add-expression"><span>＋</span> 记录一句话</button>
    <nav>
      <button data-page="review" class="nav-item active"><span data-icon="messages"></span><span class="nav-label">表达回顾</span><span id="entry-count" class="nav-count">0</span></button>
      <button data-page="voices" class="nav-item"><span data-icon="wave"></span><span class="nav-label">我的音色</span></button>
    </nav>
    <div class="sidebar-note"><span class="eyebrow">SAY IT YOUR WAY</span><p>从你说过的话，<br>到更自然的表达。</p></div>
    <div class="sidebar-bottom"><div class="local-label"><i></i> 本地工作空间</div><button data-page="settings" class="nav-item"><span data-icon="settings"></span><span class="nav-label">设置</span></button><div class="profile"><span class="avatar">S</span><div>本地学习者<small>你的表达，你的声音</small></div><span class="version">0.2</span></div></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><button class="icon-button" data-action="sidebar" aria-label="收起侧栏" title="收起侧栏"><span data-icon="sidebar"></span></button><span id="breadcrumb">表达回顾</span><div class="topbar-right"><span id="language-badge"></span><button id="fullscreen" class="icon-button" data-action="fullscreen" title="进入全屏" aria-label="进入全屏"><span data-icon="expand"></span></button></div></header>
    <main id="main" tabindex="-1"><div class="loading">正在打开本地工作空间…</div></main>
  </div>
</div>
<dialog id="editor" aria-labelledby="dialog-title"><form id="editor-form"><header class="dialog-header"><h2 id="dialog-title"></h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭">×</button></header><div id="editor-fields"></div><p id="form-error" class="form-error" role="alert"></p><footer class="dialog-footer"><button type="button" class="button" data-action="close-dialog">取消</button><button class="button primary" id="save-editor" type="submit">保存</button></footer></form></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="reading-prompts.js"></script>
<script src="recorder.js"></script>
<script src="app.js"></script>
</body></html>
